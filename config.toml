# The tool's committed levers. No channels here: the channel list (and anything
# specific to one use, such as topic_keywords) lives in your own channels file,
# given with `--channels FILE` or `channels_file` in local.toml; template:
# channels.example.toml. Machine-specific values (data_root, channels_file) go
# in local.toml (copy local.toml.example). Missing keys take in-code defaults.

# At or below this many seconds a video is a Short and is not fetched.
shorts_max_seconds = 180

# Seconds between per-video requests. Polite pacing; do not lower casually.
# 6 s right after a full index of a dozen channels hit HTTP 429 after 8 videos (2026-11-13).
fetch_delay_seconds = 15.0

# Halt triggers. Videos that are unavailable or have no captions never extend
# the error streak; a bot check halts at once and leaves STOPPED-bot-check.txt.
consecutive_fetch_error_limit = 3
fetch_error_rate_limit = 0.03
missing_caption_rate_limit = 1.0

# Fetch priority and `picks`: per channel, this many most-viewed and most-recent.
pick_top = 10
pick_recent = 10

# Topic selection (`yt-harvest select`): keyword in title or description, or at
# least `mention_threshold` distinct keywords in the transcript. Set
# `topic_keywords` in your channels file; with none, nothing matches by topic.
mention_threshold = 3
